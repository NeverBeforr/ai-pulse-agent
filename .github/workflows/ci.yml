name: 离线检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install '.[dev]'
      - run: pytest -q
      - run: ruff check .
      - run: pulse demo
      - run: python -m ai_pulse demo
      - run: pulse run --dry-run --config tests/fixtures/pulse.yaml
