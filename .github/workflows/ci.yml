name: 离线检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[dev]'
      - run: pytest -q
      - run: ruff check .
      - run: pulse demo
      - run: pulse run --dry-run --config tests/fixtures/pulse.yaml
