[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pulse-agent"
version = "0.3.0"
description = "可自托管的每日中文简报引擎"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4",
  "httpx>=0.27,<1", "feedparser>=6,<7", "beautifulsoup4>=4.12,<5",
  "pydantic-settings>=2.6,<3", "apscheduler>=3.10,<4", "tzdata",
  "openai>=1.60,<3", "pyyaml>=6,<7",
]

[project.scripts]
pulse = "ai_pulse.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_pulse = ["templates/*.html", "static/*", "fixtures/*", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".conda", "data", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
